name: Continuous Integration
on:
  push:
    branches:
      - main

  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

  release:
    types: [ published ]

  workflow_dispatch:
    inputs:
      version:
        description: "Version to be released (syntax: v<major>.<minor>.<patch>)"
        required: true

jobs:
  test-go:
    name: Test Go code
    strategy:
      matrix:
        os: [ macos-latest, ubuntu-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install MISE
        uses: jdx/mise-action@v4

      - name: Install dependencies
        run: mise run install:go

      - name: Test
        run: mise run test:go

  lint-go:
    name: "Lint Go code"
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install MISE
        uses: jdx/mise-action@v4

      - name: Install Go dependencies
        run: mise run install:go

      - name: Lint Go
        run: mise run lint:go
