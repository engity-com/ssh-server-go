name: "🐛 Bug Report"
description: Create a report to help us improve
title: "[BUG] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Would you like to help us improve SSH Server SDK for Go? That would be great! 🙂

  - type: textarea
    id: version
    attributes:
      label: Version
      description: Paste here the used version of this SDK.
      placeholder: Version
      render: text
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: If applicable, add screenshots to help explain your problem.
      placeholder: |
        1. Connected to '...'
        2. Executed '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Add any other context about the problem here.
    validations:
      required: false

  - type: markdown
    attributes:
      value: Thank you for your contribution. 🙏
